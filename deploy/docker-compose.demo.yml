services:
  suplenitud-demo:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PRAYER_REQUESTS_PUBLIC_ENABLED: ${PRAYER_REQUESTS_PUBLIC_ENABLED:-false}
    image: suplenitud-demo-nextjs:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_SITE_URL: https://demo.suplenitud.com
      GEO_TRUST_PROXY_HEADERS: ${GEO_TRUST_PROXY_HEADERS:-false}
      PRAYER_REQUESTS_PUBLIC_ENABLED: ${PRAYER_REQUESTS_PUBLIC_ENABLED:-false}
    networks:
      n8n-internal:
        aliases:
          - suplenitud-demo

networks:
  n8n-internal:
    external: true
    name: n8n-internal
