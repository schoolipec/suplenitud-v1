services:
  suplenitud-demo:
    container_name: suplenitud-demo-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PRAYER_REQUESTS_PUBLIC_ENABLED: ${PRAYER_REQUESTS_PUBLIC_ENABLED:-true}
    image: suplenitud-demo-nextjs:local
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.suplenitud-demo.entrypoints: websecure
      traefik.http.routers.suplenitud-demo.rule: Host(`demo.suplenitud.com`)
      traefik.http.routers.suplenitud-demo.tls: "true"
      traefik.http.routers.suplenitud-demo.tls.certresolver: letsencrypt
      traefik.http.services.suplenitud-demo.loadbalancer.server.port: "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_SITE_URL: https://demo.suplenitud.com
      APP_ADMIN_URL: ${APP_ADMIN_URL:-}
      CMS_MEDIA_DIR: /opt/suplenitud-media
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@suplenitud.com}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      GEO_TRUST_PROXY_HEADERS: ${GEO_TRUST_PROXY_HEADERS:-false}
      GEOIP_DATABASE_PATH: /opt/geoip/GeoLite2-City.mmdb
      PRAYER_REQUESTS_PUBLIC_ENABLED: ${PRAYER_REQUESTS_PUBLIC_ENABLED:-true}
      PRAYER_NOTIFICATION_WEBHOOK_URL: ${PRAYER_NOTIFICATION_WEBHOOK_URL:-}
      PRAYER_NOTIFICATION_WEBHOOK_SECRET: ${PRAYER_NOTIFICATION_WEBHOOK_SECRET:-}
    extra_hosts:
      - "mail.suplenitud.com:172.16.1.1"
    volumes:
      - /opt/suplenitud-demo/geoip:/opt/geoip:ro
      - /opt/suplenitud-demo/media:/opt/suplenitud-media
    networks:
      n8n-internal:
        aliases:
          - suplenitud-demo
      mailcow-network:

networks:
  n8n-internal:
    external: true
    name: n8n-internal
  mailcow-network:
    external: true
    name: mailcowdockerized_mailcow-network
